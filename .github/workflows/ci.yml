name: Validate website

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test --experimental-loader ./scripts/cloudflare-validation-loader.mjs tests/rendered-html.test.mjs
