name: Deploy website

on:
  push:
    branches: [develop, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: westernprise-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build cPanel package
        run: npm run build

      - name: Protect and label staging package
        if: github.ref_name == 'develop'
        env:
          STAGING_AUTH_USERNAME: ${{ secrets.STAGING_AUTH_USERNAME }}
          STAGING_AUTH_PASSWORD: ${{ secrets.STAGING_AUTH_PASSWORD }}
        run: |
          if [ -z "$STAGING_AUTH_USERNAME" ] || [ -z "$STAGING_AUTH_PASSWORD" ]; then
            echo "Staging authentication secrets are required."
            exit 1
          fi
          AUTH_TOKEN="$(printf '%s:%s' "$STAGING_AUTH_USERNAME" "$STAGING_AUTH_PASSWORD" | base64 -w 0)"
          cat >> dist/client/.htaccess <<EOF

          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{HTTP:Authorization} !^Basic\ ${AUTH_TOKEN}$
            RewriteRule ^ - [R=401,L]
          </IfModule>

          <IfModule mod_headers.c>
            Header always set WWW-Authenticate "Basic realm=Westernprise-Staging" "expr=%{REQUEST_STATUS} == 401"
            Header always set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>
          EOF
          printf 'User-agent: *\nDisallow: /\n' > dist/client/robots.txt

      - name: Deploy staging
        if: github.ref_name == 'develop'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/client/
          server-dir: ${{ format('{0}/', secrets.STAGING_SERVER_DIR) }}
          state-name: .westernprise-staging-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
          timeout: 120000

      - name: Verify staging access controls
        if: github.ref_name == 'develop'
        env:
          STAGING_AUTH_USERNAME: ${{ secrets.STAGING_AUTH_USERNAME }}
          STAGING_AUTH_PASSWORD: ${{ secrets.STAGING_AUTH_PASSWORD }}
        run: |
          PUBLIC_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' https://staging.westernprise.com/)"
          test "$PUBLIC_STATUS" = "401"
          curl --fail --silent --show-error --user "$STAGING_AUTH_USERNAME:$STAGING_AUTH_PASSWORD" https://staging.westernprise.com/ > /dev/null

      - name: Deploy production
        if: github.ref_name == 'production'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/client/
          server-dir: ${{ format('{0}/', secrets.PRODUCTION_SERVER_DIR) }}
          state-name: .westernprise-production-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
          timeout: 120000
